<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Візитівка EMET</title>
    <style>
        /* ДИЗАЙН И СТИЛИ */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f8; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .card { 
            background: white; 
            width: 90%; 
            max-width: 400px; 
            padding: 40px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            display: none; /* Скрыто до загрузки данных */
        }

        .logo { 
            max-width: 150px; 
            height: auto; 
            margin-bottom: 20px; 
        }
        
        h1 { 
            font-size: 22px; 
            color: #333; 
            margin: 0 0 10px 0; 
            line-height: 1.4;
        }
        
        p { 
            color: #777; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }
        
        /* КНОПКИ */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 18px 0; 
            margin-bottom: 15px; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            color: white; 
            cursor: pointer; 
            text-decoration: none; 
            box-sizing: border-box; 
            transition: transform 0.1s; 
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-viber { 
            background-color: #7360f2; 
            box-shadow: 0 4px 15px rgba(115, 96, 242, 0.3); 
        }
        /* Стиль для Telegram */
        .btn-tg { 
            background-color: #229ED9; 
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3); 
        }
        
        .btn-insta { 
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); 
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3); 
        }
        
        .footer { margin-top: 20px; font-size: 12px; color: #ccc; }
        .loader { font-size: 18px; color: #666; margin-top: 20px; }
        .error { color: #e74c3c; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div id="loader" class="loader">Завантаження...</div>
    <div id="errorMsg" class="error"></div>

    <div class="card" id="card">
        <img src="https://links.emet.in.ua/wp-content/uploads/2026/01/avatar-you-tube-1_150h150.png" class="logo" alt="Logo">
        
        <h1 id="managerName">Менеджер</h1>
        <p>Оберіть зручний спосіб зв'язку</p>
        
        <a id="linkViber" href="#" class="btn btn-viber" onclick="sendStat('viber')" target="_blank">Написати у Viber</a>
        <a id="linkTg" href="#" class="btn btn-tg" onclick="sendStat('tg')" target="_blank" style="display:none;">Написати у Telegram</a>
        <a id="linkInsta" href="#" class="btn btn-insta" onclick="sendStat('insta')" target="_blank">Перейти в Instagram</a>
    </div>

    <div class="footer">EMET UA</div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        
        // Ссылка на Google Script (Ваша, правильная)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDD6I6MooOgkt8Pqde0TRoMGqeGTec1rO-RDidSYTJgWG7926JihehAf7R4lV-nSk/exec"; 
        // Дані менеджера лежать в окремому файлі m/<id>.json і тягнуться на
        // вимогу. Раніше тут був масив усіх 19 записів — тобто будь-хто, хто
        // відкривав вихідний код сторінки, забирав увесь список контактів
        // одним рухом. Тепер сторінка знає лише про того, кого відкрили.

        // ==========================================
        // ЛОГИКА РАБОТЫ
        // ==========================================
        
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const loader = document.getElementById('loader');
        const card = document.getElementById('card');
        const errorMsg = document.getElementById('errorMsg');
        function showError() {
            loader.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.innerText = "Помилка: Невірне посилання або менеджера не знайдено.";
        }

        // Приймаємо лише цифри: id підставляється в шлях до файлу, і будь-що
        // інше там робити нічого.
        if (!id || !/^\d+$/.test(id)) {
            showError();
        } else {
            fetch('m/' + id + '.json', { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
                .then(function (data) {
            
            // Заполняем данными
            document.getElementById('managerName').innerHTML = "Ваш менеджер:<br>" + data.name;
            document.getElementById('linkViber').href = data.viber;
            document.getElementById('linkInsta').href = data.insta;
            // Логика для Telegram
const tgBtn = document.getElementById('linkTg');
if (data.tg) {
    tgBtn.href = data.tg;
    tgBtn.style.display = 'block'; // Показываем кнопку
} else {
    tgBtn.style.display = 'none';  // Скрываем, если ссылки нет
}
            
            // Показываем карточку
            loader.style.display = 'none';
            card.style.display = 'block';
                })
                .catch(showError);
        }

        // Функция отправки статистики (тихая)
        function sendStat(type) {
            // Если ссылка на скрипт не настроена, ничего не делаем
            if (!SCRIPT_URL || SCRIPT_URL.includes("ВСТАВЬТЕ")) return;
            
            // Отправляем запрос на сервер Google без ожидания ответа
            fetch(SCRIPT_URL + "?id=" + id + "&type=" + type + "&agent=" + navigator.userAgent, {
                mode: 'no-cors'
            });
        }
    </script>
</body>
</html>
